services:
  ghost-watch-c2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghost-watch-terminal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
